name: downlink

# Rebuilds the profile card from live GitHub data.
#   - every 6 hours, so the card never goes stale
#   - on push, so template edits are visible immediately
#   - manually, for when you want to force a refresh
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "telemetry.py"
      - "svg/templates/**"
      - ".github/workflows/telemetry.yml"
  workflow_dispatch:

# Needed so the job can push the regenerated SVGs back to the repo.
permissions:
  contents: write

# A scheduled run and a push run must not race each other into the same
# branch; let the newer one wait rather than fail on a rejected push.
concurrency:
  group: downlink
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect telemetry and render
        env:
          # A PAT with `repo` + `read:user`. The default GITHUB_TOKEN cannot
          # read private-repo contributor stats or your full commit history,
          # so the numbers come out low if you use it instead.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: python telemetry.py

      - name: Commit if the card changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svg/dark_mode.svg svg/light_mode.svg cache/loc.json
          # Nothing to do when the stats are byte-identical to last run.
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "downlink: refresh telemetry card"
          git push
